server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    sendfile off;
    add_header Cache-Control "no-store, no-cache, must-revalidate";

    location = / {
        try_files /index.html =404;
    }

    location = /login { try_files /auth/login.html =404; }
    location = /register { try_files /auth/register.html =404; }
    location = /cart { try_files /cart.html =404; }
    location = /myorders { try_files /myorders.html =404; }
    location = /profile { try_files /profile.html =404; }
    location = /placeorder { try_files /placeorder.html =404; }
    location = /addproduct { try_files /farmer/addproduct.html =404; }
    location = /farmer/dashboard { try_files /farmer/dashboard.html =404; }
    location = /farmer/myproducts { try_files /farmer/myproducts.html =404; }
    location = /farmer/orders { try_files /farmer/orders.html =404; }
    location ^~ /farmer/editproduct/ { try_files /farmer/editproduct.html =404; }
    location ^~ /farmer/reviews/ { try_files /farmer/reviews.html =404; }
    location = /admin/dashboard { try_files /admin/dashboard.html =404; }
    location = /admin/users { try_files /admin/users.html =404; }
    location = /admin/products { try_files /admin/products.html =404; }
    location = /admin/orders { try_files /admin/orders.html =404; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://php:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://php:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /farmfresh/ {
        proxy_pass http://php:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
