server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.php;

    # Frontend HTML Routes
    location / {
        try_files $uri $uri/ $uri.html @custom_routes;
    }

    location @custom_routes {
        rewrite ^/login$ /auth/login.html last;
        rewrite ^/register$ /auth/register.html last;
        rewrite ^/addproduct$ /farmer/addproduct.html last;
        return 404;
    }

    # Backend API Routes
    location /api/ {
        alias /var/www/html/api/;

        # Root-level API endpoint aliases
        rewrite ^/api/getuser$ /api/user/getuser.php last;
        rewrite ^/api/login$ /api/auth/login.php last;
        rewrite ^/api/register$ /api/auth/register.php last;
        rewrite ^/api/profile$ /api/auth/profile.php last;
        rewrite ^/api/updateprofile$ /api/auth/updateprofile.php last;

        try_files $uri $uri/ @api_extension;
    }

    location @api_extension {
        rewrite ^/api/(.*)$ /api/$1.php last;
    }

    # FastCGI PHP Execution Handler
    location ~ \.php$ {
        root /var/www/html;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
    }
}
