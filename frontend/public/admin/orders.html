<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Orders - FarmFresh</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      display: flex;
      min-height: 100vh;
      background-color: #f0f4f0;
      color: #333;
    }

    .sidebar {
      width: 240px;
      background: #28a745;
      color: white;
      padding: 28px 0;
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; bottom: 0; left: 0;
      box-shadow: 4px 0 15px rgba(0,0,0,0.12);
      z-index: 50;
    }

    .sidebar-brand {
      padding: 0 24px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.15);
      margin-bottom: 16px;
    }

    .sidebar-brand h2 { font-size: 22px; font-weight: 700; }

    .admin-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,0.18);
      color: white;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      margin-top: 6px;
    }

    .sidebar nav {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 0 12px;
      flex: 1;
    }

    .sidebar nav a {
      color: rgba(255,255,255,0.9);
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      padding: 11px 14px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s ease;
    }

    .sidebar nav a:hover, .sidebar nav a.active {
      background: rgba(255,255,255,0.18);
      color: white;
    }

    .sidebar nav a i { width: 18px; font-size: 14px; }

    .main {
      margin-left: 240px;
      flex: 1;
      padding: 30px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    .topbar-left h1 { font-size: 22px; font-weight: 700; color: #28a745; }
    .topbar-left p { font-size: 13px; color: #888; margin-top: 2px; }

    .btn-logout {
      background: white;
      color: #dc3545;
      border: 1.5px solid #dc3545;
      padding: 8px 18px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-logout:hover { background: #dc3545; color: white; }

    .table-wrapper {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    thead {
      background: #28a745;
    }

    th {
      padding: 14px 18px;
      text-align: left;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: white;
      font-weight: 600;
    }

    td {
      padding: 14px 18px;
      border-bottom: 1px solid #f0f0f0;
      color: #444;
      vertical-align: top;
    }

    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background-color: #f8fdf9; }

    .order-id { font-weight: 700; color: #28a745; }
    .customer-name { font-weight: 600; color: #333; }
    .customer-email { color: #888; font-size: 12px; }
    .address-cell { font-size: 12px; color: #555; max-width: 180px; line-height: 1.5; }
    .amount-cell { font-weight: 700; color: #333; }
    .date-cell { color: #999; font-size: 12px; white-space: nowrap; }

    .status-badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .status-badge.delivered  { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
    .status-badge.pending    { background: #fff8e1; color: #f57f17; border: 1px solid #ffe082; }
    .status-badge.confirmed  { background: #e3f2fd; color: #1565c0; border: 1px solid #bbdefb; }
    .status-badge.cancelled  { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { margin-left: 0; padding: 20px; }
      table { font-size: 12px; }
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="sidebar-brand">
      <a href="/admin/dashboard" style="color: inherit; text-decoration: none;"><h2>FarmFresh</h2></a>
      <div class="admin-badge"><i class="fas fa-shield-halved"></i> Admin Panel</div>
    </div>
    <nav>
      <a href="/admin/dashboard"><i class="fas fa-chart-pie"></i> Dashboard</a>
      <a href="/admin/users"><i class="fas fa-users"></i> Users</a>
      <a href="/admin/products"><i class="fas fa-box-open"></i> Products</a>
      <a href="/admin/orders" class="active"><i class="fas fa-receipt"></i> Orders</a>
    </nav>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <h1>All Orders</h1>
        <p>Track and manage all customer orders</p>
      </div>
      <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Customer</th>
            <th>Phone</th>
            <th>Address</th>
            <th>Status</th>
            <th>Amount</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="orderTableBody">
          <tr><td colspan="7" style="text-align:center;color:#aaa;padding:30px;">Loading orders...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const token = document.cookie.match(/(^| )token=([^;]+)/)?.[2];
    if (!token) { alert("Please login as admin."); window.location.href = "/login"; }

    function logout() {
      document.cookie = "token=; path=/; expires=Thu, 01 Jan 1970 00:00:00 UTC;";
      window.location.href = "/login";
    }

    const statusIcons = {
      delivered: 'fa-circle-check',
      pending: 'fa-clock',
      confirmed: 'fa-thumbs-up',
      cancelled: 'fa-circle-xmark'
    };

    async function loadOrders() {
      const tableBody = document.getElementById("orderTableBody");
      try {
        const res = await fetch("/api/dashboard/orderslist", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token })
        });
        const data = await res.json();
        tableBody.innerHTML = "";

        if (data.status === "success" && data.orders?.length) {
          data.orders.forEach(order => {
            const icon = statusIcons[order.status] || 'fa-circle';
            const row = document.createElement("tr");
            row.innerHTML = `
              <td class="order-id">${order.order_id}</td>
              <td>
                <div class="customer-name">${order.customer_name}</div>
                <div class="customer-email">${order.customer_email}</div>
              </td>
              <td>${order.mobile || 'N/A'}</td>
              <td class="address-cell">${order.address || 'N/A'}</td>
              <td><span class="status-badge ${order.status}"><i class="fas ${icon}"></i> ${order.status}</span></td>
              <td class="amount-cell">₹${parseFloat(order.total_price).toFixed(2)}</td>
              <td class="date-cell">${new Date(order.created_at).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' })}</td>
            `;
            tableBody.appendChild(row);
          });
        } else {
          tableBody.innerHTML = `<tr><td colspan="7" style="text-align:center;color:#aaa;padding:30px;">No orders found.</td></tr>`;
        }
      } catch (err) {
        tableBody.innerHTML = `<tr><td colspan="7" style="text-align:center;color:red;padding:30px;">Failed to fetch orders.</td></tr>`;
      }
    }

    loadOrders();
  </script>
</body>
</html>
